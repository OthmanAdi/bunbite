name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Frontend JS syntax
        run: |
          node --check public/i18n.js
          node --check public/app.js

      - name: i18n coverage (EN / DE / AR)
        run: node scripts/i18n-check.mjs .

      - name: Core tests (store, key validation, durable rate limit, restart durability)
        run: |
          DB_PATH="$RUNNER_TEMP/ci.sqlite" KEYFILE="$RUNNER_TEMP/ci.key" bun server/test/core.ts all
          DB_PATH="$RUNNER_TEMP/ci.sqlite" KEYFILE="$RUNNER_TEMP/ci.key" bun server/test/core.ts verify

      - name: Webhook signature verification
        run: STRIPE_WEBHOOK_SECRET=whsec_ci_test bun server/test/webhook.ts
