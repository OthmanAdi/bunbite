<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BunBite — Pro activated</title>
  <meta name="description" content="Your BunBite Pro key.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%236366f1'/><text x='16' y='23' text-anchor='middle' fill='white' font-size='18' font-weight='bold'>B</text></svg>">
  <script src="/i18n.js"></script>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>

  <header class="header">
    <div class="container">
      <a class="logo" href="/" style="text-decoration:none;color:inherit">
        <div class="logo-icon">
          <svg viewBox="0 0 32 32" fill="none"><rect x="2" y="2" width="28" height="28" rx="6" stroke="url(#g1)" stroke-width="2.5"/><path d="M8 22L14 14L18 18L22 12L26 22" stroke="url(#g1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.5" fill="url(#g1)"/><defs><linearGradient id="g1" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs></svg>
        </div>
        <span class="logo-text">BunBite</span>
      </a>
      <div class="header-right">
        <label class="lang-switch" data-i18n-attr="aria-label:lang.label" aria-label="Language">
          <svg class="lang-globe" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M3 12h18M12 3c2.5 2.5 2.5 16 0 18M12 3c-2.5 2.5-2.5 16 0 18" stroke="currentColor" stroke-width="1.7"/></svg>
          <select id="langSelect"><option value="en">EN</option><option value="de">DE</option><option value="ar">AR</option></select>
        </label>
        <a class="btn-upgrade" href="/" data-i18n="nav.back">Back to app</a>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="container" style="max-width:560px">
      <section class="hero" style="padding-bottom:16px">
        <div style="font-size:3rem;margin-bottom:8px">🎉</div>
        <h1 data-i18n="success.title">You're Pro now</h1>
        <p class="hero-sub" data-i18n="success.sub">Thank you. Here is your API key.</p>
      </section>

      <section class="controls glass-card" style="display:block">
        <div id="state-pending">
          <p style="color:var(--text2);font-size:.9rem" data-i18n="success.pending">Confirming your payment…</p>
        </div>

        <div id="state-key" hidden>
          <label class="control label" data-i18n="success.yourKey" style="display:block;margin-bottom:8px">Your API key</label>
          <div style="display:flex;gap:8px;align-items:stretch;flex-wrap:wrap">
            <input id="keyOut" type="text" readonly style="flex:1;min-width:220px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:12px 13px;color:var(--text);font-family:ui-monospace,monospace;font-size:.85rem">
            <button class="btn btn-ghost" id="copyBtn" data-i18n="success.copy">Copy</button>
          </div>
          <p style="color:var(--warn);font-size:.8rem;margin-top:12px" data-i18n="success.warn">Store this key now.</p>
          <button class="btn btn-primary" id="activateBtn" data-i18n="success.activate" style="margin-top:16px;width:100%">Activate in the app</button>
        </div>

        <div id="state-error" hidden>
          <p style="color:var(--err);font-size:.9rem" data-i18n="success.error">We could not confirm this checkout session.</p>
          <a class="btn btn-ghost" href="/pricing.html" style="margin-top:14px" data-i18n="nav.pricing">Pricing</a>
        </div>
      </section>
    </div>
  </main>

  <div class="toast-container" id="toasts"></div>

  <script>
    (function () {
      "use strict";
      var t = function (k) { return window.I18N ? window.I18N.t(k) : k; };
      var sel = document.getElementById("langSelect");
      if (sel && window.I18N) { sel.value = window.I18N.getLang(); sel.addEventListener("change", function () { window.I18N.setLang(sel.value); }); }

      var params = new URLSearchParams(location.search);
      var sessionId = params.get("session_id");
      var pending = document.getElementById("state-pending");
      var keyState = document.getElementById("state-key");
      var errorState = document.getElementById("state-error");
      var keyOut = document.getElementById("keyOut");

      function show(el) { pending.hidden = true; keyState.hidden = true; errorState.hidden = true; el.hidden = false; }
      function fail() { show(errorState); }

      function activate(key) {
        try { localStorage.setItem("bunbite_api_key", key); } catch (e) {}
        location.href = "/";
      }

      document.getElementById("copyBtn").addEventListener("click", function () {
        if (!keyOut.value) return;
        (navigator.clipboard ? navigator.clipboard.writeText(keyOut.value) : Promise.reject()).then(function () {
          var b = document.getElementById("copyBtn"); b.textContent = t("success.copied"); setTimeout(function () { b.textContent = t("success.copy"); }, 1600);
        }).catch(function () { keyOut.select(); document.execCommand && document.execCommand("copy"); });
      });
      document.getElementById("activateBtn").addEventListener("click", function () { activate(keyOut.value); });

      if (!sessionId) { fail(); return; }

      var tries = 0, MAX = 12;
      function poll() {
        tries++;
        fetch("/api/checkout/session?session_id=" + encodeURIComponent(sessionId))
          .then(function (r) { return r.status === 202 ? { _pending: true } : r.json(); })
          .then(function (data) {
            if (data && data.key) { keyOut.value = data.key; show(keyState); return; }
            if (tries >= MAX) { fail(); return; }
            setTimeout(poll, 1500);
          })
          .catch(function () { if (tries >= MAX) fail(); else setTimeout(poll, 1500); });
      }
      poll();
    })();
  </script>
</body>
</html>
